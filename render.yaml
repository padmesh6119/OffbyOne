services:
  - type: web
    name: OffbyOne
    runtime: docker
    rootDir: backend
    branch: main
    envVars:
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JUDGE0_API_KEY
        sync: false

  - type: web
    name: OffbyOne-1
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
